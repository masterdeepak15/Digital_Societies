name: Release

# Every push to main: run the tests, build the Android app, then publish ONE Docker image that holds
# everything (API, admin website, MinIO, Postgres, Redis, proxy) and carries the Android app for download.
#   docker run -d -p 8080:8080 -v ds-data:/data ghcr.io/<owner>/digital-societies:latest

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION:   '20.x'
  JAVA_VERSION:   '17'
  # The server address the phone app starts with. Set the repository variable API_BASE_URL to change it;
  # people can still type their own server on the app's sign-in screen.
  API_BASE_URL:   ${{ vars.API_BASE_URL || 'https://societies.athomes.space/api/v1' }}
  IMAGE_NAME:     ghcr.io/${{ github.repository_owner }}/digital-societies

jobs:
  # ── 1. Tests: nothing is published if these fail ───────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Backend tests
        run: dotnet test tests/DigitalSocieties.Identity.Tests/DigitalSocieties.Identity.Tests.csproj -c Release

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Admin website tests
        working-directory: apps/web-admin
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          npx tsc --noEmit
          npm test

  # ── 2. Android app ─────────────────────────────────────────────────────────
  apk:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install deps (fresh, no lockfile, to force correct hoisting)
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Expo Prebuild (Android)
        env:
          EXPO_PUBLIC_API_URL: ${{ env.API_BASE_URL }}
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # With a keystore secret the app is signed with your own key (needed to update it on phones later).
      # Without one the build still works and is signed with the standard debug key.
      - name: Decode Keystore (if provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key."
          fi

      - name: Build Release APK
        env:
          EXPO_PUBLIC_API_URL: ${{ env.API_BASE_URL }}
          KEYSTORE_PASSWORD:   ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:           ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:        ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            ./gradlew assembleRelease \
              -PANDROID_KEYSTORE_FILE=release.keystore \
              -PANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
              -PANDROID_KEY_ALIAS="$KEY_ALIAS" \
              -PANDROID_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      - name: Keep the APK for the image (and for download from this run)
        uses: actions/upload-artifact@v4
        with:
          name: digital-societies-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

  # ── 3. The one Docker image ────────────────────────────────────────────────
  image:
    name: Docker image (everything in one)
    needs: [test, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the Android app into the build
        uses: actions/download-artifact@v4
        with:
          name: digital-societies-apk
          path: apk-download

      - name: Name the app file
        run: |
          cp apk-download/app-release.apk apk/digital-societies.apk
          ls -lh apk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase; this also fills in the tags.
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    infra/docker/allinone/Dockerfile
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
