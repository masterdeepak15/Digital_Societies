# Override for local development — hot reload, verbose logging, ports exposed
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
name: digital-societies-dev

services:
  api:
    build:
      context: ../../services
      dockerfile: DigitalSocieties.Api/Dockerfile
      target: build   # stop at build stage for faster iteration
    volumes:
      - ../../services:/src    # mount source for hot-reload
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_WATCH_SUPPRESS_EMOJIS: 1
      # Sign-in codes land in Mailpit (http://localhost:8025) — no SMTP account needed.
      Notification__Email__Host:        mailpit
      Notification__Email__Port:        "1025"
      Notification__Email__Security:    None
      Notification__Email__FromAddress: no-reply@digitalsocieties.local
    depends_on:
      - mailpit
    command: dotnet watch run --project DigitalSocieties.Api/DigitalSocieties.Api.csproj

  # Local mail catcher: SMTP on 1025, web UI on 8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [ds-net]

  postgres:
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: devpassword

  redis:
    ports: ["6379:6379"]
    command: redis-server --requirepass devpassword

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO console at localhost:9001
    environment:
      MINIO_ROOT_USER:     devaccess
      MINIO_ROOT_PASSWORD: devsecretkey
